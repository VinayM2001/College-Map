<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NID Campus 3D Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6) url('https://cdn-icons-png.flaticon.com/512/54/54461.png') center/cover no-repeat;
      border: none;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    #floorSelector {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .floor-btn {
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .floor-btn.active { background: rgba(255,100,100,0.8); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="compassBtn" title="Toggle Orientation"></button>
  <div id="floorSelector">
    <button class="floor-btn active" data-model="Insti_map_Final.glb">Campus</button>
    <button class="floor-btn" data-model="G_floor_Final.glb">Ground</button>
    <button class="floor-btn" data-model="1st_floor_Final.glb">1st</button>
    <button class="floor-btn" data-model="2nd_floor_Final.glb">2nd</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let modelGroup = new THREE.Group();
    let currentModel;
    let orientMode = false;
    let hasInitial = false, lastAlpha = 0, smoothAlpha = 0, offset = 0;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      // --- Camera (50mm) ---
      camera = new THREE.PerspectiveCamera(39.6, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(4, 3, 6);

      // --- Renderer ---
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // --- Lighting ---
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.2);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
      sunLight.position.set(10, 20, 10);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(4096, 4096);
      scene.add(sunLight);

      // --- Grid Helper (for debugging, optional) ---
      // scene.add(new THREE.GridHelper(10, 10));

      // --- Controls ---
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI * 0.95;
      controls.target.set(0, 0, 0);

      scene.add(modelGroup);
      loadModel('Insti_map_Final.glb');

      // --- Events ---
      window.addEventListener('resize', onWindowResize);
      document.getElementById('compassBtn').addEventListener('click', toggleMode);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('deviceorientation', handleOrientation);

      document.querySelectorAll('.floor-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadModel(btn.dataset.model);
        });
      });
    }

    // --- Load GLB Model ---
    function loadModel(fileName) {
      const loader = new GLTFLoader();
      loader.load(fileName,
        (gltf) => {
          if (currentModel) modelGroup.remove(currentModel);
          currentModel = gltf.scene;

          // Center model properly
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          currentModel.position.sub(center);

          const size = box.getSize(new THREE.Vector3());
          const scale = 4 / Math.max(size.x, size.y, size.z);
          currentModel.scale.setScalar(scale);

          modelGroup.position.set(0, 0, 0);
          modelGroup.add(currentModel);

          console.log('✅ Model loaded:', fileName);
        },
        (xhr) => console.log((xhr.loaded / xhr.total * 100) + '% loaded'),
        (err) => console.error('❌ Model loading error:', err)
      );
    }

    // --- Recenter on Tap ---
    function onPointerDown(event) {
      if (!currentModel) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);

      if (intersects.length > 0) {
        const point = intersects[0].point.clone();
        modelGroup.position.sub(point);
        controls.target.set(0, 0, 0);
        controls.update();
        console.log('🟢 Centered at:', point);
      }
    }

    // --- Orientation Mode (Align North) ---
    function handleOrientation(e) {
      if (!orientMode || !currentModel) return;
      const alpha = e.alpha;
      if (alpha == null) return;

      if (!hasInitial) { offset = alpha; hasInitial = true; }

      let diff = alpha - lastAlpha;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      lastAlpha += diff * 0.1;
      smoothAlpha = (lastAlpha - offset) % 360;

      modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothAlpha);
      document.getElementById('compassBtn').style.transform = `rotate(${smoothAlpha}deg)`;
    }

    // --- Toggle Explore / Orient Mode ---
    function toggleMode() {
      orientMode = !orientMode;
      hasInitial = false;
      const compass = document.getElementById('compassBtn');
      compass.style.background = orientMode
        ? 'rgba(255,100,100,0.8) url(https://cdn-icons-png.flaticon.com/512/54/54461.png) center/cover no-repeat'
        : 'rgba(0,0,0,0.6) url(https://cdn-icons-png.flaticon.com/512/54/54461.png) center/cover no-repeat';
      controls.enableRotate = !orientMode;
      controls.enablePan = !orientMode;
      controls.enableZoom = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
