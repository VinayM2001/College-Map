<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NID Campus 3D Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }

    /* Compass toggle button */
    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at center, #fff, #ddd);
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 10;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/2/27/Compass_rose_simple.svg');
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease;
    }

    /* Floor selector */
    #floorSelect {
      position: absolute;
      top: 80px;
      right: 15px;
      z-index: 10;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.8);
      font-weight: bold;
      border: none;
      font-family: sans-serif;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="compassBtn" title="Toggle Orientation"></button>
  <select id="floorSelect">
    <option value="Insti_map_Final.glb">Institute Map</option>
    <option value="G_floor_Final.glb">Ground Floor</option>
    <option value="1st_floor_Final.glb">1st Floor</option>
    <option value="2nd_floor_Final.glb">2nd Floor</option>
  </select>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls, model, modelGroup;
    let orientMode = false;
    let deviceAlpha = 0;
    let smoothedAlpha = 0;

    init();
    animate();

    function init() {
      // Scene
      scene = new THREE.Scene();

      // Camera
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(4, 3, 4);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.3);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
      dirLight.position.set(5, 10, 7);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048, 2048);
      scene.add(dirLight);

      // Model Group
      modelGroup = new THREE.Group();
      scene.add(modelGroup);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI * 0.9;

      // Load default model
      loadModel('INSTITUTE MAP.glb');

      // Handle floor change
      document.getElementById('floorSelect').addEventListener('change', (e) => {
        loadModel(e.target.value);
      });

      // Compass toggle
      const compassBtn = document.getElementById('compassBtn');
      compassBtn.addEventListener('click', () => {
        orientMode = !orientMode;
        compassBtn.style.filter = orientMode ? 'drop-shadow(0 0 10px red)' : 'none';
      });

      // Device orientation event
      window.addEventListener('deviceorientation', (event) => {
        if (orientMode && modelGroup) {
          deviceAlpha = event.alpha || 0;
          smoothedAlpha += (deviceAlpha - smoothedAlpha) * 0.1;
          modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothedAlpha);
        }
      });

      // Resize handling
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Load model function
    function loadModel(path) {
      const loader = new GLTFLoader();
      loader.load(path, (gltf) => {
        if (modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
        model = gltf.scene;

        // Center model
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        // Scale to a consistent size
        const size = box.getSize(new THREE.Vector3());
        const scale = 3 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);

        modelGroup.add(model);
        controls.target.set(0, 0, 0);
        controls.update();

        console.log(`Loaded ${path}`);
      });
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
