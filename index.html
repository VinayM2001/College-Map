<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NID Campus 3D Map (Three.js)</title>

  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }

    #floorControls {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: rgba(0,0,0,0.8); }

    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
      z-index: 10;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="floorControls">
    <button onclick="loadModel('Insti_map_Final.glb')">Institute Map</button>
    <button onclick="loadModel('G_floor_Final.glb')">Ground Floor</button>
    <button onclick="loadModel('1st_floor_Final.glb')">1st Floor</button>
    <button onclick="loadModel('2nd_floor_Final.glb')">2nd Floor</button>
  </div>

  <div id="compassBtn">🧭</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let modelGroup = new THREE.Group();
    let currentModel;
    let orientMode = false;

    let lastAlpha = 0, smoothAlpha = 0, offset = 0, hasInitial = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      // --- Camera ---
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(5, 3, 5);

      // --- Renderer ---
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // --- Lighting ---
      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(10, 15, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048, 2048);
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
      fillLight.position.set(-10, 10, -10);
      scene.add(fillLight);

      // --- Controls ---
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI * 0.95;
      controls.target.set(0, 0, 0);

      // --- Scene group ---
      scene.add(modelGroup);

      // --- Load default model ---
      loadModel('Insti_map_Final.glb');

      // --- Events ---
      window.addEventListener('resize', onWindowResize);
      document.getElementById('compassBtn').addEventListener('click', toggleMode);

      // Device orientation listeners
      window.addEventListener('deviceorientationabsolute', handleOrientation);
      window.addEventListener('deviceorientation', handleOrientation);

      // Tap event to recenter
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
    }

    // --- Load model ---
    function loadModel(fileName) {
      const loader = new GLTFLoader();
      loader.load(fileName, (gltf) => {
        if (currentModel) modelGroup.remove(currentModel);

        currentModel = gltf.scene;

        // Center model properly
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);

        // Scale appropriately
        const size = box.getSize(new THREE.Vector3());
        const scale = 3 / Math.max(size.x, size.y, size.z);
        currentModel.scale.setScalar(scale);

        // Add to group
        modelGroup.add(currentModel);
      });
    }

    // --- Handle tap to center ---
    function onPointerDown(event) {
      if (!currentModel) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);

      if (intersects.length > 0) {
        const point = intersects[0].point;

        // Move camera focus
        controls.target.copy(point);
        controls.update();

        // Move modelGroup so the tapped point becomes new rotation origin
        modelGroup.position.sub(point);

        console.log("Centered model on:", point);
      }
    }

    // --- Device orientation handling ---
    function normalizeAngle(angle) {
      angle = angle % 360;
      if (angle < 0) angle += 360;
      return angle;
    }

    function handleOrientation(e) {
      const alpha = e.alpha;
      if (alpha == null || !orientMode) return;

      if (!hasInitial) {
        offset = alpha;
        hasInitial = true;
      }

      let diff = alpha - lastAlpha;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      lastAlpha += diff * 0.1;
      smoothAlpha = normalizeAngle(lastAlpha - offset);

      modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothAlpha);
      document.getElementById('compassBtn').style.transform = `rotate(${smoothAlpha}deg)`;
    }

    // --- Toggle mode ---
    function toggleMode() {
      orientMode = !orientMode;
      hasInitial = false;

      const compass = document.getElementById('compassBtn');
      compass.style.background = orientMode ? 'rgba(255,100,100,0.8)' : 'rgba(0,0,0,0.6)';

      // Disable/Enable horizontal rotation in orient mode
      controls.enableRotate = !orientMode;
      controls.enablePan = !orientMode;
      controls.enableZoom = true; // always allow zoom
    }

    // --- Resize handler ---
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Animation loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
