<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NID Campus 3D Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }

    /* Compass Button */
    #compassBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      background-image: url('https://cdn-icons-png.flaticon.com/512/32/32195.png');
      background-size: cover;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="compassBtn"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    let orientMode = true; // start in device-orientation mode
    let model, modelGroup;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isInteracting = false;

    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(39, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(15, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(4096, 4096);
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    // Fill light for realism
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI * 0.95;
    controls.minPolarAngle = 0.1; // prevent going under map
    controls.target.set(0, 0, 0);

    // Group for model (origin at center)
    modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // --- Load Model ---
    const loader = new GLTFLoader();
    loader.load('./1st_floor_Final.glb', (gltf) => {
      model = gltf.scene;

      // Center model around its bounding box
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      const scale = 3 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      modelGroup.add(model);

      // Add some sample hotspots
      addHotspot(new THREE.Vector3(0, 0.1, 0), 'https://example.com');
      addHotspot(new THREE.Vector3(1, 0.1, -1), 'https://example.com/2');
    });

    // --- Hotspot Function ---
    function addHotspot(position, url) {
      const spriteMap = new THREE.TextureLoader().load('https://cdn-icons-png.flaticon.com/512/684/684908.png');
      const spriteMaterial = new THREE.SpriteMaterial({ map: spriteMap, sizeAttenuation: false });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.position.copy(position);
      sprite.scale.set(0.2, 0.2, 0.2);
      sprite.userData = { url };
      scene.add(sprite);
    }

    // --- Device Orientation ---
    let deviceAlpha = 0;
    let smoothedAlpha = 0;

    window.addEventListener('deviceorientation', (event) => {
      if (orientMode && modelGroup && !isInteracting) {
        deviceAlpha = event.alpha || 0;
        smoothedAlpha += (deviceAlpha - smoothedAlpha) * 0.1;
        modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothedAlpha);
      }
    }, true);

    // --- Compass Toggle ---
    document.getElementById('compassBtn').addEventListener('click', () => {
      orientMode = !orientMode;
    });

    // --- Interaction Handling ---
    renderer.domElement.addEventListener('pointerdown', () => { isInteracting = true; });
    renderer.domElement.addEventListener('pointerup', () => { isInteracting = false; });

    // --- Recenter on mousedown ---
    renderer.domElement.addEventListener('mousedown', (event) => {
      if (!model) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(model, true);
      if (intersects.length > 0) {
        const point = intersects[0].point;
        modelGroup.position.sub(point); // shift origin to clicked point
        controls.target.copy(new THREE.Vector3(0,0,0));
        controls.update();
      }
    });

    // --- Hotspot click ---
    renderer.domElement.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);
      for (let inter of intersects) {
        if (inter.object.userData.url) {
          window.open(inter.object.userData.url, '_blank');
        }
      }
    });

    // --- Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

  </script>
</body>
</html>
