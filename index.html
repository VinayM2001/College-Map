<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NID Campus 3D Map Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 20px; background: #e0e0e0; overflow: hidden; }
    model-viewer { width: 100vw; height: 100vh; }
    .controls {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }
    button {
      border: 2px;
      border-radius: 10px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: rgba(0,0,0,0.8); }
    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform 0.5s ease;
    }
  </style>
</head>
<body>

  <model-viewer id="campusViewer"
    src="Insti_map_Final.glb"
    alt="NID Campus Map"
    camera-controls
    camera-orbit="0deg 75deg 5m"
    camera-target="auto"
    field-of-view="45deg"
    exposure="1.2"
    shadow-intensity="1">
  </model-viewer>

  <div class="controls">
    <button onclick="setModel('Insti_map_Final.glb')">Institute Map</button>
    <button onclick="setModel('G_floor_Final.glb')">Ground Floor</button>
    <button onclick="setModel('1st_floor_Final.glb')">1st Floor</button>
    <button onclick="setModel('2nd_floor_Final.glb')">2nd Floor</button>
  </div>

  <div id="compassBtn">🧭</div>

  <script>
    const viewer = document.getElementById('campusViewer');
    const compassBtn = document.getElementById('compassBtn');
    let orientMode = false;
    let deviceAlpha = 0;
    let smoothedAlpha = 0;

    function setModel(modelName) {
      viewer.src = modelName;
    }

    compassBtn.addEventListener('click', () => {
      orientMode = !orientMode;
      compassBtn.style.background = orientMode ? 'rgba(255, 100, 100, 0.8)' : 'rgba(0, 0, 0, 0.6)';
    });

    window.addEventListener('deviceorientation', (event) => {
      if (orientMode) {
        deviceAlpha = event.alpha || 0;
        smoothedAlpha += (deviceAlpha - smoothedAlpha) * 0.1;
        compassBtn.style.transform = `rotate(${smoothedAlpha}deg)`;
        viewer.cameraOrbit = `${smoothedAlpha}deg 75deg 5m`;
      }
    });
  </script>
</body>
</html>
