<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NID Campus 3D Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #toggleBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="toggleBtn">Switch to Orient Mode</button>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    let orientMode = false;
    let model, modelGroup;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // --- Scene, Camera, Renderer ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    // --- Controls ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI * 0.95;
    controls.target.set(0, 0, 0);

    // --- Model Group ---
    modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // --- Load Model ---
    const loader = new GLTFLoader();
    loader.load('./1st_floor_Final.glb', (gltf) => {
      model = gltf.scene;

      // Center the model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      const size = box.getSize(new THREE.Vector3());
      const scale = 3 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      // Add model to group
      modelGroup.add(model);
      console.log('Model loaded & centered.');
    });

    // --- Device Orientation (Align to Real-World North) ---
    let deviceAlpha = 0;
    let smoothedAlpha = 0;

    window.addEventListener('deviceorientation', (event) => {
      if (orientMode && modelGroup) {
        deviceAlpha = event.alpha || 0;

        // Smooth rotation
        smoothedAlpha += (deviceAlpha - smoothedAlpha) * 0.1;

        // Rotate model group to align with device heading
        modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothedAlpha);
      }
    }, true);

    // --- Toggle Button ---
    const toggleBtn = document.getElementById('toggleBtn');
    toggleBtn.addEventListener('click', () => {
      orientMode = !orientMode;
      toggleBtn.innerText = orientMode ? 'Switch to Explore Mode' : 'Switch to Orient Mode';
    });

    // --- Recenter on Mouse Down ---
    function onMouseDown(event) {
      if (!model) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(model, true);

      if (intersects.length > 0) {
        const point = intersects[0].point;
        controls.target.copy(point);
        controls.update();
        console.log('Recentered to:', point);
      }
    }
    renderer.domElement.addEventListener('mousedown', onMouseDown);

    // --- Handle Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
