<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NID Campus 3D Map Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #e0e0e0; overflow: hidden; }
    model-viewer { width: 100vw; height: 100vh; }
    .controls {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: rgba(0,0,0,0.8); }
    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

  <model-viewer id="campusViewer"
    src="Insti_map_Final.glb"
    alt="NID Campus Map"
    camera-controls
    camera-orbit="0deg 75deg 5m"
    camera-target="auto"
    field-of-view="45deg"
    shadow-intensity="1"
    exposure="1.3"
    environment-image="neutral"
    disable-zoom>
  </model-viewer>

  <div class="controls">
    <button onclick="setModel('Insti_map_Final.glb')">Institute Map</button>
    <button onclick="setModel('G_floor_Final.glb')">Ground Floor</button>
    <button onclick="setModel('1st_floor_Final.glb')">1st Floor</button>
    <button onclick="setModel('2nd_floor_Final.glb')">2nd Floor</button>
  </div>

  <div id="compassBtn">🧭</div>

  <script>
    const viewer = document.getElementById('campusViewer');
    const compassBtn = document.getElementById('compassBtn');

    let orientMode = false;
    let lastAlpha = 0;
    let smoothAlpha = 0;
    let offset = 0;
    let hasInitial = false;

    function setModel(modelName) {
      viewer.src = modelName;
    }

    // Toggle between explore/orient mode
    compassBtn.addEventListener('click', () => {
      orientMode = !orientMode;
      compassBtn.style.background = orientMode
        ? 'rgba(255, 100, 100, 0.8)'
        : 'rgba(0, 0, 0, 0.6)';
      if (orientMode) {
        hasInitial = false; // Reset reference for smooth start
      }
    });

    // Smooth orientation without skips at 360° wrap
    function normalizeAngle(angle) {
      angle = angle % 360;
      if (angle < 0) angle += 360;
      return angle;
    }

    function smoothRotate(alpha) {
      if (!hasInitial) {
        offset = alpha;
        hasInitial = true;
      }

      // Calculate difference considering wrap-around
      let diff = alpha - lastAlpha;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      lastAlpha += diff * 0.1; // smoothing factor

      smoothAlpha = normalizeAngle(lastAlpha - offset);

      compassBtn.style.transform = `rotate(${smoothAlpha}deg)`;

      if (orientMode) {
        viewer.cameraOrbit = `${smoothAlpha}deg 75deg 5m`;
      }
    }

    // Listen to device orientation
    window.addEventListener('deviceorientationabsolute', (e) => {
      if (e.alpha != null) smoothRotate(e.alpha);
    });
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha != null) smoothRotate(e.alpha);
    });
  </script>
</body>
</html>
