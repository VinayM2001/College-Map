<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NID Campus 3D Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #compassBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      z-index: 10;
    }
    #compassIcon {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: url('https://upload.wikimedia.org/wikipedia/commons/9/99/Compass_icon.svg') center/cover no-repeat;
      filter: invert(1);
    }
    #floorSelector {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      z-index: 10;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="compassBtn"><div id="compassIcon"></div></button>

  <select id="floorSelector">
    <option value="Insti_map_Final.glb">Campus View</option>
    <option value="G_floor_Final.glb">Ground Floor</option>
    <option value="1st_floor_Final.glb">1st Floor</option>
    <option value="2nd_floor_Final.glb">2nd Floor</option>
  </select>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    // === [1] Scene Setup ===
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // === [2] Camera Setup ===
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);

    // Camera controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;   // 🔧 Minimum zoom distance
    controls.maxDistance = 10;  // 🔧 Maximum zoom distance
    controls.maxPolarAngle = Math.PI * 0.95;

    // === [3] Lighting Setup ===
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(10, 15, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    // === [4] Model Loading ===
    const loader = new GLTFLoader();
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);
    let currentModel = null;

    function loadModel(path) {
      if (currentModel) modelGroup.remove(currentModel);

      loader.load(path, (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center); // Center model to origin

        const size = box.getSize(new THREE.Vector3());
        const scale = 3 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);

        currentModel = model;
        modelGroup.add(model);
      });
    }

    loadModel('Insti_map_Final.glb'); // Default model

    // Handle floor selector
    document.getElementById('floorSelector').addEventListener('change', (e) => {
      loadModel(e.target.value);
    });

    // === [5] Device Orientation ===
    let orientMode = false;
    let deviceAlpha = 0, smoothedAlpha = 0;

    window.addEventListener('deviceorientation', (event) => {
      if (orientMode && modelGroup) {
        deviceAlpha = event.alpha || 0;
        smoothedAlpha += (deviceAlpha - smoothedAlpha) * 0.1;
        modelGroup.rotation.y = THREE.MathUtils.degToRad(-smoothedAlpha);
      }
    });

    // === [6] Compass Button (Explore ↔ Orient toggle) ===
    const compassBtn = document.getElementById('compassBtn');
    compassBtn.addEventListener('click', () => {
      orientMode = !orientMode;
      compassBtn.style.background = orientMode ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0.6)';
    });

    // === [7] Tap to Center ===
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('mousedown', (event) => {
      if (!currentModel) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentModel, true);
      if (intersects.length > 0) {
        const point = intersects[0].point;
        controls.target.copy(point); // Move orbit pivot
        controls.update();
      }
    });

    // === [8] Handle Resize ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // === [9] Render Loop ===
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
