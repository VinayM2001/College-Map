<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NID Campus 3D Map Viewer - Three.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; background: #e0e0e0; overflow: hidden; }
        /* Three.js output will fill the canvas */
        #container { width: 100vw; height: 100vh; }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: rgba(0,0,0,0.8); }
        #compassBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transform: rotate(0deg);
            transition: transform 0.3s ease;
            z-index: 5; /* Ensure it's above the canvas */
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <div class="controls">
        <button onclick="setModel('Insti_map_Final.glb')">Institute Map</button>
        <button onclick="setModel('G_floor_Final.glb')">Ground Floor</button>
        <button onclick="setModel('1st_floor_Final.glb')">1st Floor</button>
        <button onclick="setModel('2nd_floor_Final.glb')">2nd Floor</button>
    </div>

    <div id="compassBtn">🧭</div>

    <script>
        // --- THREE.JS SETUP ---
        const container = document.getElementById('container');
        const compassBtn = document.getElementById('compassBtn');

        let scene, camera, renderer, controls, loader;
        let currentModel = null;
        const INITIAL_MODEL = 'Insti_map_Final.glb';

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0); // Matches the body background

            // 2. Camera (Equivalent to camera-orbit and field-of-view)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            // camera-orbit="0deg 75deg 5m" -> camera is 5 units away, 75 degrees above the horizontal plane.
            camera.position.set(0, 2, 5); // Initial estimate; OrbitControls will manage the actual orbit

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true; // Equivalent to shadow-intensity

            // Equivalent to exposure="1.3" (requires tone mapping)
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;

            container.appendChild(renderer.domElement);

            // 4. Lighting (model-viewer uses PBR, so we need lights)
            // Ambient light for general brightness
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            // Directional light for shadows (similar to "shadow-intensity")
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 5. Controls (Equivalent to camera-controls and disable-zoom)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0); // camera-target="auto" often targets the center
            controls.enableZoom = false; // Equivalent to disable-zoom
            controls.enablePan = true;
            controls.update();

            // 6. GLTF Loader
            loader = new THREE.GLTFLoader();

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);

            // Load the initial model
            loadModel(INITIAL_MODEL);

            // Start the animation loop
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // only required if controls.enableDamping = true, but good practice
            renderer.render(scene, camera);
        }

        // --- MODEL LOADING FUNCTION ---
        function loadModel(modelName) {
            // Remove the previous model from the scene
            if (currentModel) {
                scene.remove(currentModel);
                currentModel.traverse(object => {
                    if (object.geometry) object.geometry.dispose();
                    if (object.material) {
                        if (Array.isArray(object.material)) {
                            object.material.forEach(material => material.dispose());
                        } else {
                            object.material.dispose();
                        }
                    }
                });
                currentModel = null;
            }

            // Load the new model
            loader.load(
                modelName,
                (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    // Optional: Recalculate controls target based on new model bounds
                    // This emulates camera-target="auto" behavior for the new model
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    controls.target.copy(center);
                    controls.update();
                },
                (xhr) => {
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                (error) => {
                    console.error('An error happened loading the model:', error);
                }
            );
        }

        // --- CONTROL FUNCTIONS (from original HTML) ---
        function setModel(modelName) {
            loadModel(modelName);
        }

        // --- DEVICE ORIENTATION LOGIC (Placeholder/Simplified) ---
        // This is where you would place the complex smoothRotate logic
        let orientMode = false;

        compassBtn.addEventListener('click', () => {
            orientMode = !orientMode;
            compassBtn.style.background = orientMode
                ? 'rgba(255, 100, 100, 0.8)'
                : 'rgba(0, 0, 0, 0.6)';

            // In Three.js, you would enable/disable OrbitControls and
            // use the device orientation data to manually update the camera position/rotation
            controls.enabled = !orientMode; // Disable standard controls in orient mode
            if (!orientMode) {
                 // Re-enable controls, maybe restore initial camera state
                 controls.update();
            }
        });

        // The original deviceorientation/smoothRotate logic would go here,
        // using e.alpha to calculate a new rotation and setting the camera's
        // `position` and `rotation` directly when `orientMode` is true.
        // Example (simplified and *not* using the smooth logic):
        /*
        window.addEventListener('deviceorientation', (e) => {
             if (e.alpha != null && orientMode) {
                 // Convert degrees to radians and apply rotation to the camera
                 const alphaInRad = THREE.MathUtils.degToRad(e.alpha);
                 // Note: This needs careful mapping to the viewer's coordinate system
                 camera.rotation.y = alphaInRad;
             }
         });
        */

        // Initialize the Three.js application
        init();
    </script>
</body>
</html>
