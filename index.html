<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NID Campus 3D Map Viewer - Three.js Recenter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; background: #e0e0e0; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: rgba(0,0,0,0.8); }
        #compassBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transform: rotate(0deg);
            transition: transform 0.3s ease;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <div class="controls">
        <button onclick="setModel('Insti_map_Final.glb')">Institute Map</button>
        <button onclick="setModel('G_floor_Final.glb')">Ground Floor</button>
        <button onclick="setModel('1st_floor_Final.glb')">1st Floor</button>
        <button onclick="setModel('2nd_floor_Final.glb')">2nd Floor</button>
    </div>

    <div id="compassBtn">🧭</div>

    <script>
        // --- THREE.JS GLOBAL VARIABLES ---
        const container = document.getElementById('container');
        const compassBtn = document.getElementById('compassBtn');

        let scene, camera, renderer, controls, loader;
        let currentModel = null;
        const INITIAL_MODEL = 'Insti_map_Final.glb';

        // --- RAYCASTING VARIABLES ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- ORIENTATION VARIABLES (from original model-viewer code) ---
        let orientMode = false;
        let lastAlpha = 0;
        let offset = 0;
        let hasInitial = false;
        const CAMERA_DISTANCE = 5; // Fixed distance (5m) from camera-orbit

        // --- INITIALIZATION ---

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0);

            // 2. Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 2, CAMERA_DISTANCE); 

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // 5. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0); // Default center
            controls.enableZoom = false; 
            controls.enablePan = true;
            controls.update();

            // 6. GLTF Loader
            loader = new THREE.GLTFLoader();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onCanvasClick, false);
            window.addEventListener('deviceorientationabsolute', onDeviceOrientation, false);
            window.addEventListener('deviceorientation', onDeviceOrientation, false);

            // Load the initial model
            loadModel(INITIAL_MODEL);
            animate();
        }

        // --- CORE FUNCTIONS ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function loadModel(modelName) {
            // Cleanup previous model
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            // Load new model
            loader.load(
                modelName,
                (gltf) => {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    // Recalculate default target (emulating camera-target="auto")
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    controls.target.copy(center);
                    controls.update();
                },
                (xhr) => { console.log((xhr.loaded / xhr.total * 100).toFixed(0) + '% loaded'); },
                (error) => { console.error('Error loading model:', error); }
            );
        }
        
        // --- RECENERING LOGIC (The core new feature) ---

        function onCanvasClick(event) {
            // Calculate mouse position in normalized device coordinates (-1 to +1)
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Only check intersections if a model is loaded
            if (currentModel) {
                // Check all parts of the current model recursively
                const intersects = raycaster.intersectObjects(currentModel.children, true);

                if (intersects.length > 0) {
                    const hitPoint = intersects[0].point;

                    // Set the OrbitControls target to the clicked 3D point
                    controls.target.copy(hitPoint);
                    controls.update();
                }
            }
        }

        // --- CONTROL FUNCTIONS (from original HTML) ---

        function setModel(modelName) {
            loadModel(modelName);
        }

        compassBtn.addEventListener('click', () => {
            orientMode = !orientMode;
            compassBtn.style.background = orientMode
                ? 'rgba(255, 100, 100, 0.8)'
                : 'rgba(0, 0, 0, 0.6)';
            
            // Disable standard orbit controls when in device orientation mode
            controls.enabled = !orientMode;

            if (orientMode) {
                hasInitial = false; // Reset reference for smooth start
            }
        });

        // --- DEVICE ORIENTATION LOGIC ---
        function normalizeAngle(angle) {
            angle = angle % 360;
            if (angle < 0) angle += 360;
            return angle;
        }

        function smoothRotate(alpha) {
            if (!hasInitial) {
                offset = alpha;
                hasInitial = true;
            }

            // Smoothing logic
            let diff = alpha - lastAlpha;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            lastAlpha += diff * 0.1; 
            
            let smoothAlpha = normalizeAngle(lastAlpha - offset);

            compassBtn.style.transform = `rotate(${smoothAlpha}deg)`;

            if (orientMode) {
                // Convert compass angle (degrees) to yaw rotation (radians)
                const yaw = THREE.MathUtils.degToRad(smoothAlpha);
                
                // Keep camera looking at the current controls.target, 
                // but move it around the target based on the device's rotation.
                
                // Get the current target position
                const target = controls.target;
                
                // Calculate the new camera position based on yaw and a fixed distance
                const newX = target.x + CAMERA_DISTANCE * Math.sin(yaw);
                const newZ = target.z + CAMERA_DISTANCE * Math.cos(yaw);
                
                // Apply the new position, keeping the height (y-coordinate)
                camera.position.set(newX, camera.position.y, newZ);
                
                // Make the camera look at the target (essential for orientation mode)
                camera.lookAt(target);
            }
        }

        function onDeviceOrientation(e) {
            // e.alpha is the rotation around the Z axis (compass direction)
            if (e.alpha != null) smoothRotate(e.alpha);
        }
        
        // Start the application
        init();
    </script>
</body>
</html>
